version: "3.9"

services:
  staging-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    configs:
      - source: staging-postgres-init
        target: /docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-postgres} -d ${STAGING_POSTGRES_DB:-staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - beeatlas-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - beeatlas-network

  staging-backend:
    build: .
    depends_on:
      staging-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8085:8080"
    stop_grace_period: 35s
    environment:
      SPRING_DATASOURCE_CAMUNDA_URL: jdbc:postgresql://staging-postgres:5432/${STAGING_POSTGRES_DB:-staging}
      SPRING_DATASOURCE_CAMUNDA_USERNAME: ${STAGING_POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_CAMUNDA_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_STAGING_HIKARI_JDBC-URL: jdbc:postgresql://staging-postgres:5432/${STAGING_POSTGRES_DB:-staging}
      SPRING_DATASOURCE_STAGING_HIKARI_USERNAME: ${STAGING_POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_STAGING_HIKARI_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-postgres}
      CAMUNDA_BPM_DATABASE_SCHEMA_UPDATE: "true"
      CAMUNDA_BPM_ADMIN_USER_ID: beeatlas
      CAMUNDA_BPM_ADMIN_USER_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD:-beeatlas}
      STAGING_S3_ENDPOINT: http://minio:9000
      STAGING_S3_ACCESS-KEY: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      STAGING_S3_SECRET-KEY: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - beeatlas-network

volumes:
  staging-postgres-data:
  minio-data:

networks:
  beeatlas-network:
    driver: bridge

configs:
  staging-postgres-init:
    content: |
      CREATE SCHEMA IF NOT EXISTS staging;
      CREATE SCHEMA IF NOT EXISTS staging_camunda;
