server:
  port: 8080

spring:
  application:
    name: staging-service
  datasource:
    camunda:
      driver-class-name: ${SPRING_DATASOURCE_CAMUNDA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      url: ${SPRING_DATASOURCE_CAMUNDA_URL:jdbc:postgresql://staging-postgres:5432/staging}
      username: ${SPRING_DATASOURCE_CAMUNDA_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_CAMUNDA_PASSWORD:postgres}
    staging:
      hikari:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://staging-postgres:5432/staging}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        maximum-pool-size: 10
        minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

camunda:
  bpm:
    admin-user:
      id: beeatlas
      password: beeatlas
    data-source: camundaDataSource
    database:
      schema-update: true
    job-execution:
      enabled: true
      lock-time-in-millis: 900000
    history-level: full
    history-time-to-live: P180D
    webapp:
      index-redirect-enabled: true

staging:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://minio:9000}
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadmin}
    bucket: ${AWS_S3_BUCKET_NAME:staging-raw-data}
    region: ${AWS_S3_REGION:us-east-1}
  dashboard:
    base-url: ${DASHBOARD_BASE_URL:https://dashboard-dev-eafdmmart.apps.yd-m6-kt22.vimpelcom.ru}
  cx-backend:
    # When true (default), CanonicalModelPublisher pushes saved canonical e2e data to
    # cx-backend's CJ/BI library for real (see CxBackendCanonicalModelPublisher). Set to
    # false to fall back to the no-op publisher (e.g. local runs without cx-backend up).
    enabled: ${CX_BACKEND_ENABLED:true}
    base-url: ${CX_BACKEND_BASE_URL:http://cx-backend:8080}
    # user-id used for the user-id header on every cx-backend write — needs to be a real,
    # valid cx-backend user id with CREATE_ARTIFACT permission for an unattended pipeline caller.
    system-user-id: ${CX_BACKEND_SYSTEM_USER_ID:1}
    # cx-backend product id every published CJ/BI is attached to. Configuration currently has
    # no per-source productId of its own, so all e2e-sequence artifacts map to one product —
    # revisit (e.g. via Configuration.config jsonb) if scenarios need to land in different products.
    default-product-id: ${CX_BACKEND_DEFAULT_PRODUCT_ID:1}
  sparx:
    # Sparx EA database (PostgreSQL). Bean is created only when SPARX_DB_URL is non-empty.
    # When not configured, Sparx pre-adapter queries are silently skipped (logged as warning).
    datasource:
      url: ${SPARX_DB_URL:}
      username: ${SPARX_DB_USERNAME:}
      password: ${SPARX_DB_PASSWORD:}
  camunda:
    timer:
      pre-adapter-sparx-cycle: R/PT6H
  worker:
    poll-interval-ms: 500
    lock-duration-ms: 30000
  recovery:
    check-interval-ms: 300000      # 5 min
    stuck-threshold-minutes: 30
    auto-retry-count: 3
  scheduler:
    scan-interval-ms: 60000        # used as reference; actual schedule driven by BPMN timer
    e2e-scan:
      enabled: false                # opt-in plain Spring scheduler, alternative to the BPMN timer (avoid enabling both)
      interval-ms: 21600000         # 6h, mirrors staging.camunda.timer.pre-adapter-sparx-cycle

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
