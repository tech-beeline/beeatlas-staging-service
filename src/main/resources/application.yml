server:
  port: 8080

spring:
  application:
    name: staging-service
  datasource:
    camunda:
      driver-class-name: ${SPRING_DATASOURCE_CAMUNDA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      url: ${SPRING_DATASOURCE_CAMUNDA_URL:jdbc:postgresql://staging-postgres:5432/staging}
      username: ${SPRING_DATASOURCE_CAMUNDA_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_CAMUNDA_PASSWORD:postgres}
    staging:
      hikari:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://staging-postgres:5432/staging}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        maximum-pool-size: 10
        minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

camunda:
  bpm:
    admin-user:
      id: beeatlas
      password: beeatlas
    data-source: camundaDataSource
    database:
      schema-update: true
    job-execution:
      enabled: true
      lock-time-in-millis: 900000
    history-level: full
    history-time-to-live: P180D
    webapp:
      index-redirect-enabled: true

staging:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://minio:9000}
    access-key: ${AWS_S3_ACCESS_KEY:minioadmin}
    secret-key: ${AWS_S3_SECRET_KEY:minioadmin}
    bucket: ${AWS_S3_BUCKET_NAME:staging-raw-data}
    region: ${AWS_S3_REGION:us-east-1}
  camunda:
    timer:
      pre-adapter-sparx-cycle: R/PT6H
  worker:
    poll-interval-ms: 500
    lock-duration-ms: 30000
  recovery:
    check-interval-ms: 300000      # 5 min
    stuck-threshold-minutes: 30
    auto-retry-count: 3
  scheduler:
    scan-interval-ms: 60000        # used as reference; actual schedule driven by BPMN timer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
