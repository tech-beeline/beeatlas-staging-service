server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: staging-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    staging:
      hikari:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://staging-postgres:5432/staging}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        maximum-pool-size: 10
        minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

integration:
  e2e-publish:
    retry-count: ${INTEGRATION_E2E_PUBLISH_RETRY_COUNT:3}
    retry-delay-ms: ${INTEGRATION_E2E_PUBLISH_RETRY_DELAY_MS:1000}
  grafana:
    retry-count: ${INTEGRATION_GRAFANA_RETRY_COUNT:3}
    retry-delay-ms: ${INTEGRATION_GRAFANA_RETRY_DELAY_MS:1000}
    timeout-ms: ${INTEGRATION_GRAFANA_TIMEOUT_MS:15000}
  metric-queries-publish:
    retry-count: ${INTEGRATION_METRIC_QUERIES_PUBLISH_RETRY_COUNT:3}
    retry-delay-ms: ${INTEGRATION_METRIC_QUERIES_PUBLISH_RETRY_DELAY_MS:1000}

staging:
  document-service:
    base-url: ${INTEGRATION_DOCUMENT_SERVER_URL:}
  dashboard:
    base-url: ${INTEGRATION_DASHBOARD_SERVER_URL:}
  sparx:
    datasource:
      url: ${STAGING_SPARX_DATASOURCE_URL:}
      username: ${STAGING_SPARX_DATASOURCE_USERNAME:}
      password: ${STAGING_SPARX_DATASOURCE_PASSWORD:}
  grafana:
    url: ${STAGING_GRAFANA_URL:}
    token: ${STAGING_GRAFANA_TOKEN:}
  executor:
    resume-poll-interval-ms: 5000  # PipelineResumeScheduler: how often abandoned/interrupted runs are picked back up
    lease-duration-ms: 300000      # 5 min — how long a claim on a run is held before it's considered abandoned
    scheduler-pool-size: 10        # threads for all @Scheduled methods (tick, resume, auto-retry)
    scan-pool-size: 4              # concurrent scans across all configurations
    artifact-pool-size: 8          # default concurrent artifact chains per configuration
    queue-capacity: 5000           # per executor; how many pending tasks before rejection kicks in
    artifact-pool-overrides: {}    # configuration.code -> pool size, e.g. sparx-e2e-prod: 20
  recovery:
    check-interval-ms: 300000      # 5 min — how often failed runs are checked for auto-retry
    max-auto-retries: 3
  scheduler:
    tick-interval-ms: 60000        # PipelineTickScheduler: how often due configurations are scanned

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,threaddump
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: staging-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
