server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: staging-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    camunda:
      driver-class-name: ${SPRING_DATASOURCE_CAMUNDA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      url: ${SPRING_DATASOURCE_CAMUNDA_URL:jdbc:postgresql://staging-postgres:5432/staging}
      username: ${SPRING_DATASOURCE_CAMUNDA_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_CAMUNDA_PASSWORD:postgres}
    staging:
      hikari:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://staging-postgres:5432/staging}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        maximum-pool-size: 10
        minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

camunda:
  bpm:
    admin-user:
      id: beeatlas
      password: beeatlas
    data-source: camundaDataSource
    database:
      schema-update: true
    job-execution:
      enabled: true
      lock-time-in-millis: 900000
    history-level: full
    history-time-to-live: P3D
    webapp:
      index-redirect-enabled: true

integration:
  e2e-publish:
    retry-count: ${INTEGRATION_E2E_PUBLISH_RETRY_COUNT:3}
    retry-delay-ms: ${INTEGRATION_E2E_PUBLISH_RETRY_DELAY_MS:1000}

staging:
  dashboard:
    base-url: ${INTEGRATION_DASHBOARD_SERVER_URL:https://dashboard-dev-eafdmmart.apps.yd-m6-kt22.vimpelcom.ru}
  sparx:
    datasource:
      url: ${STAGING_SPARX_DATASOURCE_URL:}
      username: ${STAGING_SPARX_DATASOURCE_USERNAME:}
      password: ${STAGING_SPARX_DATASOURCE_PASSWORD:}
  worker:
    poll-interval-ms: 500
    lock-duration-ms: 120000
  recovery:
    check-interval-ms: 300000      # 5 min
    stuck-threshold-minutes: 30
    auto-retry-count: 3
    incident-retry-interval-ms: 30000
    max-incident-auto-retries: 2
  camunda:
    schema: ${STAGING_CAMUNDA_SCHEMA:staging_camunda}
  scheduler:
    tick-interval-ms: 60000        # PipelineTickScheduler: how often due configurations are scanned

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
