server:
  port: 8080

app:
  ambassador-auth: true

integration:
  authsso-server-url: ${INTEGRATION_AUTHSSO_SERVER_URL:http://eafdmmart-develop-ambassador/rabbit-token}

spring:
  application:
    name: staging-service
  datasource:
    camunda:
      driver-class-name: ${SPRING_DATASOURCE_CAMUNDA_DRIVER_CLASS_NAME:org.postgresql.Driver}
      url: ${SPRING_DATASOURCE_CAMUNDA_URL:jdbc:postgresql://staging-postgres:5432/staging}
      username: ${SPRING_DATASOURCE_CAMUNDA_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_CAMUNDA_PASSWORD:postgres}
    staging:
      hikari:
        driver-class-name: org.postgresql.Driver
        jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://staging-postgres:5432/staging}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        maximum-pool-size: 10
        minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VIRTUAL_HOST:/}

camunda:
  bpm:
    admin-user:
      id: beeatlas
      password: beeatlas
    data-source: camundaDataSource
    database:
      schema-update: true
    job-execution:
      enabled: true
      lock-time-in-millis: 900000
    history-level: full
    history-time-to-live: P180D
    webapp:
      index-redirect-enabled: true

staging:
  dashboard:
    base-url: ${INTEGRATION_DASHBOARD_SERVER_URL:https://dashboard-dev-eafdmmart.apps.yd-m6-kt22.vimpelcom.ru}
  sparx:
    datasource:
      url: ${STAGING_SPARX_DATASOURCE_URL:}
      username: ${STAGING_SPARX_DATASOURCE_USERNAME:}
      password: ${STAGING_SPARX_DATASOURCE_PASSWORD:}
  camunda:
    timer:
      pre-adapter-sparx-cycle: R/PT6H
  worker:
    poll-interval-ms: 500
    lock-duration-ms: 30000
  recovery:
    check-interval-ms: 300000      # 5 min
    stuck-threshold-minutes: 30
    auto-retry-count: 3
  scheduler:
    scan-interval-ms: 60000        # used as reference; actual schedule driven by BPMN timer
    e2e-scan:
      enabled: false                # opt-in plain Spring scheduler, alternative to the BPMN timer (avoid enabling both)
      interval-ms: 21600000         # 6h, mirrors staging.camunda.timer.pre-adapter-sparx-cycle

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
